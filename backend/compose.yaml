services:
  mysql:
    image: docker.io/library/mysql:8.0
    environment:
      MYSQL_DATABASE: article
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - article_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Containerfile.dev
    environment:
      DATABASE_URL: mysql+pymysql://user1@mysql:3306/article?charset=utf8mb4
    command: ["alembic", "upgrade", "head"]
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Containerfile.dev
    environment:
      APP_NAME: Sharing Vision Article API
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RELOAD: "true"
      DATABASE_URL: mysql+pymysql://user1@mysql:3306/article?charset=utf8mb4
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SQL_ECHO: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  article_mysql_data:
